<!doctype html>
<html lang="en" style="background-color: #030712; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Frosty Arcade</title>
    <meta name="description" content="Frosty Arcade - High performance web game archive and launcher." />
    <meta property="og:title" content="Frosty Arcade" />
    <meta property="og:description" content="Frosty Arcade - High performance web game archive and launcher." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polyline points='12 6 12 12 16 14'/></svg>" />
    <!-- Ruffle Flash WebAssembly Emulator -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle" async></script>
    <style>
      html, body {
        background-color: #030712 !important;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        height: 100%;
        overflow-x: hidden;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #030712;
      }
      #root:empty::after {
        content: "";
        width: 42px;
        height: 42px;
        border: 3px solid rgba(56, 189, 248, 0.15);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: frosty-spin 0.8s linear infinite;
      }
      @keyframes frosty-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200" style="background-color: #030712;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
